version: '3.8'

services:
  tailscale-sidecar:
    image: tailscale/tailscale:latest
    container_name: tailscale-sidecar
    hostname: jellyfin
    entrypoint: ["/bin/sh", "/scripts/sidecar-init.sh"]
    environment:
      - TS_EXTRA_ARGS=--login-server=https://headscale.pranaovs.me
      - TS_STATE_DIR=/var/lib/tailscale
      - TS_USERSPACE=false
      - TS_ENABLE_HEALTH_CHECK=true
      - TS_LOCAL_ADDR_PORT=127.0.0.1:41234
      - TS_AUTH_ONCE=true
      - TS_PORT=41642
      - HOST_GW=172.18.0.1
      - JELLYFIN_PORT=8096
    volumes:
      - ${ARRPATH}Jellyfin/tailscale-state:/var/lib/tailscale
      - ./sidecar-init.sh:/scripts/sidecar-init.sh:ro
    ports:
      - '41642:41642/udp' # WireGuard listen port (host tailscaled uses 41641)
    devices:
      - /dev/net/tun:/dev/net/tun
    cap_add:
      - net_admin
    sysctls:
      - net.ipv4.ip_forward=1
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://127.0.0.1:41234/healthz"]
      interval: 1m
      timeout: 10s
      retries: 3
      start_period: 10s
    restart: unless-stopped
    networks:
      arr_warp:

  # Opens host INPUT so the sidecar yoink (docker bridge -> host Jellyfin) works.
  host-jellyfin-allow:
    image: nicolaka/netshoot:latest
    container_name: host-jellyfin-allow
    network_mode: host
    cap_add:
      - NET_ADMIN
    command:
      - sh
      - -c
      - |
        BR=br-35b8df3efe40
        iptables -C INPUT -i $$BR -p tcp --dport 8096 -j ACCEPT 2>/dev/null \
          || iptables -I INPUT 1 -i $$BR -p tcp --dport 8096 -j ACCEPT
        exec sleep infinity
    restart: unless-stopped

networks:
  arr_warp:
    external: true
    name: arr_warp
