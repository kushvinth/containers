services:
  tailscale-sidecar:
    image: tailscale/tailscale:latest
    container_name: tailscale-sidecar
    hostname: jellyfin
    entrypoint: ["/bin/sh", "/scripts/sidecar-init.sh"]
    environment:
      - TS_EXTRA_ARGS=--login-server=https://headscale.kushvinth.com
      - TS_STATE_DIR=/var/lib/tailscale
      - TS_USERSPACE=false
      - TS_ENABLE_HEALTH_CHECK=true
      - TS_LOCAL_ADDR_PORT=127.0.0.1:41234
      - TS_AUTH_ONCE=true
      - TS_PORT=41642
      - HOST_GW=172.18.0.1
      - HOST_SUBNET=172.18.0.0/16
      - PORTS=8096 25565 25567 22
    volumes:
      - ${ARRPATH}Jellyfin/tailscale-state:/var/lib/tailscale
      - ./sidecar-init.sh:/scripts/sidecar-init.sh:ro
    ports:
      - '41642:41642/udp' # WireGuard listen port (host tailscaled uses 41641)
    devices:
      - /dev/net/tun:/dev/net/tun
    cap_add:
      - NET_ADMIN
      - NET_RAW
      - SYS_ADMIN   # nsenter into the host netns to open the host INPUT chain
      - SYS_PTRACE  # needed to read /proc/1/ns/net
    pid: host
    security_opt:
      - apparmor=unconfined # docker-default profile blocks reading /proc/1/ns/*
    sysctls:
      - net.ipv4.ip_forward=1
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://127.0.0.1:41234/healthz"]
      interval: 1m
      timeout: 10s
      retries: 3
      start_period: 10s
    restart: unless-stopped
    networks:
      arr_warp:

networks:
  arr_warp:
    external: true
    name: arr_warp
