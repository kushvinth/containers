services:
  minecraft:
    image: itzg/minecraft-server:latest
    container_name: minecraft-speedrun-server
    ports:
      - "25567:25565"
      - "19162:19132/udp"
      - "24457:24454/udp"
    environment:
      EULA: "TRUE"
      TYPE: "FABRIC"
      VERSION: "1.21.11"
      MEMORY: "4G"
      MAX_TICK_TIME: "-1"
      TZ: "Asia/Kolkata"
      USE_MEOWICE_FLAGS: "true"
      USE_AIKAR_FLAGS: "true"
      AUTOPAUSE_KNOCK_INTERFACE: "eth0"
      DIFFICULTY: "hard"
      ONLINE_MODE: "false"
      VIEW_DISTANCE: "16"
      SIMULATION_DISTANCE: "10"
      MODRINTH_PROJECTS: |-
        clumps
        lithium
        krypton
        ferrite-core
        styledplayerlist
        badpackets
        c2me-fabric
        chunky
        minimotd
        noisiumforked
        spark
        packet-fixer
        discord-mc-chat

        simple-voice-chat
        ore-harvester
        tree-harvester
        villager-names-serilum
        rightclickharvest
        easyauth
        your-items-are-safe
        inventory-sorting
        skinrestorer
        no-dim
        anti-xray
        appleskin
        enchantment-lore
        
        player-drops-head
        system-teams
        lifesteal-mian
        instarestock
        grimac
        anti-chunkbans
        luckperms

      MODRINTH_DOWNLOAD_DEPENDENCIES: "required"
      MODRINTH_ALLOWED_VERSION_TYPE: "alpha"
      ENFORCE_SECURE_PROFILE: "false"
      RCON_CMDS_STARTUP: |-
        gamerule players_sleeping_percentage 1
        chunky continue
        worldborder center 0 0
        gamerule locatorBar false
        worldborder set 5000
      RCON_CMDS_FIRST_CONNECT: |-
        chunky pause
      RCON_CMDS_LAST_DISCONNECT: |-
        chunky continue
      BUG_REPORT_LINK: "https://github.com/kushvinth/containers"
    volumes:
      - ./data:/data
    restart: unless-stopped

